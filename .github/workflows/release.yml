# 发布工作流：打 tag（v*）或手动触发时，在 Windows runner 上跑测试并构建
# Tauri 安装包（MSI/NSIS）+ 免安装 exe，然后自动创建 GitHub Release 并上传产物。
#
# 用法（推荐）：
#   1. 本地提交全部改动并推送 master
#   2. 打 tag 并推送： git tag -a v0.1.0 -m "NoteApp 0.1.0" && git push origin v0.1.0
#   3. Actions 自动构建并生成 Release
# 也可在 Actions 页面手动 Run workflow，填入已存在的 tag（如 v0.1.0）。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release (Windows)
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies (root + web)
        run: |
          npm ci
          npm ci --prefix web

      # 规范门禁：单测 / 类型 / Prettier（逻辑代码）/ rustfmt / clippy 必须干净。
      # 全部经 scripts/ci-check.ps1 包装：失败时把输出写进 job summary 并抛出 ::error:: 注解，
      # 因为 Actions 的完整日志需要认证，而 summary 与注解可通过公开 API 读到
      # （2026-10-01 发布 v0.2.0 时正是因为没有这个，失败原因完全看不到）。
      # 用 -ExecutionPolicy Bypass 显式调用：与仓库其它脚本入口一致，避免 runner 的
      # 执行策略把未签名脚本拦在"启动之前"——那种失败连 summary 都是空的。
      - name: Unit tests
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci-check.ps1 -Label 'Unit tests' -Command 'node --test --test-isolation=none "tests/**/*.test.mjs"'

      - name: Type check
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci-check.ps1 -Label 'Type check' -Command 'npm --prefix web run typecheck'

      - name: Format check (Prettier, ts+mjs)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci-check.ps1 -Label 'Format check' -Command 'npm run format:check'

      - name: Rust format check
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci-check.ps1 -Label 'Rust format check' -Command 'cargo fmt --manifest-path src-tauri/Cargo.toml --check'

      - name: Rust lint (clippy, warnings are errors)
        shell: pwsh
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/ci-check.ps1 -Label 'Rust clippy' -Command 'cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings'

      - name: Build app and create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'NoteApp __VERSION__'
          releaseBody: |
            NoteApp desktop release (Tauri 2 + Svelte + TypeScript), pure local Markdown storage.

            **This release does NOT include the quick-capture floating window**
            (global hotkey / floating quick note), which is planned for a later version.

            ## New in v0.2.0 (verified against the v0.1.0 tag, not against its notes)

            The v0.1.0 release notes were written ahead of the code and were later edited by
            feature commits, so they list features that the v0.1.0 build never contained
            (`theme.ts` / `tags.ts` / `todos.ts` / `md-format.ts` do not exist at that tag).
            The four headline features below **first ship in v0.2.0**:

            - **Theme: light / dark / follow-system**, applied to both windows, persisted,
              live-following the OS theme, all colors via CSS variables, no first-paint flash.
            - **Tags and pinning**: add tags from the editor, filter by tag, pin notes to the
              top; both stored in the note's own frontmatter (self-describing `.md` files).
            - **Todo aggregation view**: every open `- [ ]` across the vault in one screen,
              checkbox writes back to the source file, click a task to jump to its line.
            - **Markdown format toolbar**: bold / italic / strike / highlight, headings, lists,
              quote, code block, link, table, undo / redo — plus `==highlight==` rendering.
            - Also: the step-by-step Chinese tutorial with an importable sample note, and
              layout fixes (single-pane filling the window, no leftover gap, draggable
              split ratio that persists).

            ## Reliability work in this release

            - Launcher + desktop shortcut that avoid the "publisher cannot be verified" prompt
              (the shortcut starts the app through `cmd /c start`).
            - Self-signed code-signing certificate (`npm run sign:exe`) wired into the build,
              so the dialog shows `NoteApp Local Build` instead of "unknown publisher".
            - Pre-build cleanup: stop the running app and **clear the WebView2 profile contents**
              (fixes the "one rebuild and the app never starts again" failure).
            - Startup log + panic capture to `noteapp-log.txt` (release builds are GUI-subsystem,
              so panics used to be invisible).
            - Diagnostics: `npm run diagnose:startup`, `npm run probe:ui` (inspect a blank window),
              `npm run link:webview`, `npm run clean:360`.
            - Quality gate `npm run verify`: unit tests + type check + Prettier + rustfmt + clippy.
              Unit tests: **183 passing**.

            Full release notes: see `docs/RELEASE_NOTES_v0.2.0.md` in the repository.
            (v0.1.0 notes are kept for history with a correction note at the top.)
          releaseDraft: false
          prerelease: false
